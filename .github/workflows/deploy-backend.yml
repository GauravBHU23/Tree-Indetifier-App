name: Deploy Backend to Azure App Service

# DISABLED: app now deploys to Render instead (see DEPLOY.md). Kept for reference
# in case this project moves back to Azure. Trigger manually via workflow_dispatch
# if ever needed again.
#
# Deploys the .NET API in backend/ to an Azure App Service.
# Prereqs (one-time, see DEPLOY.md):
#   - An App Service (Linux, .NET 8) created in Azure
#   - Repo secret AZURE_WEBAPP_PUBLISH_PROFILE  (from the App Service → Get publish profile)
#   - Repo variable AZURE_WEBAPP_NAME           (your App Service name)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish backend/TreeIdentifier.Api.csproj -c Release -o publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
