name: Deploy Frontend to Azure Static Web Apps

# Builds the Vite app in frontend/ and deploys it to Azure Static Web Apps.
# Prereqs (one-time, see DEPLOY.md):
#   - A Static Web App created in Azure
#   - Repo secret AZURE_STATIC_WEB_APPS_API_TOKEN  (from the Static Web App → Manage deployment token)
#   - Repo variable VITE_API_BASE_URL              (your deployed backend URL, e.g. https://xxx.azurewebsites.net)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "frontend"
          output_location: "dist"
        env:
          # Baked into the build so the browser calls the real backend.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
